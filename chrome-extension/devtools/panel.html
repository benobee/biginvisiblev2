<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MockMonkey Panel</title>
    <link rel="stylesheet" href="panel.css">
</head>
<body>
    <div id="mockmonkey-container">
        <!-- Header Controls -->
        <div id="header" class="header">
            <div class="header-title">
                <strong>🐵 MockMonkey</strong>
                <span class="version">v2.0</span>
            </div>
            <div class="header-controls">
                <button id="refreshBtn" class="btn btn-sm" title="Soft Refresh">
                    🔄 Refresh
                </button>
                <button id="clearLog" class="btn btn-sm" title="Clear Logs">
                    🗑️ Clear
                </button>
                <button id="exportMocks" class="btn btn-sm" title="Export Mocks">
                    📤 Export
                </button>
                <button id="importMocks" class="btn btn-sm" title="Import Mocks">
                    📥 Import
                </button>
            </div>
        </div>

        <!-- Filter Controls -->
        <div id="filters" class="filters">
            <div class="filter-row">
                <input type="text" id="filterEndpoint" placeholder="Filter requests (e.g., /api/users)" 
                       class="filter-input" autocomplete="off">
                <div class="filter-toggles">
                    <label class="checkbox-label">
                        <input type="checkbox" id="enableMocking" checked> 
                        <span class="enable-mocking">Enable Mocking</span>
                    </label>
                </div>
            </div>
            <div class="filter-row">
                <input type="text" id="customIgnorePatterns" 
                       placeholder="Custom ignore patterns (comma-separated, e.g., .woff2, analytics, /tracking/)" 
                       class="filter-input" autocomplete="off">
                <div class="asset-filter-info">
                    <small>🚫 Auto-filtered: .js, .css, .png, .jpg, .jpeg, .gif, .svg, .ico, .webp, .woff, .woff2, .ttf, .eot</small>
                </div>
            </div>
        </div>

        <!-- Stats Bar -->
        <div id="stats" class="stats">
            <span id="totalRequests">Requests: 0</span>
            <span id="mockedRequests">Mocked: 0</span>
            <span id="activeMocks">Active Mocks: 0</span>
        </div>

        <!-- Request Log Container -->
        <div id="logContainer" class="log-container">
            <div class="empty-state">
                <div class="empty-icon">🌐</div>
                <p>No network requests captured yet.</p>
                <p class="empty-hint">Refresh the page or navigate to see HTTP requests.</p>
            </div>
        </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="importFileInput" accept=".json" style="display: none;">

    <script src="../shared/storage-manager.js"></script>
    <script src="../shared/mock-definitions.js"></script>
    <script src="panel.js"></script>
</body>
</html>
